name: CheckLinks
on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '13 10 * * *'

jobs:
  checklinks:
    name: Check Links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build documentation repo
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Next references from study dev
        uses: ./.github/actions/generate-study-docs
        with:
          ref: dev

      - name: Update Next references
        run: |
          node scripts/syncStudyDocs.mjs .study-docs docs/next
          rm -rf .study-docs

      - name: Build documentation
        run: yarn build

      - name: Run link checker
        run: yarn checkLinks
