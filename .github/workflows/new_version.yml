name: Promote documentation release

on:
  repository_dispatch:
    types: [study_repo_publish]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact stable study tag to publish (for example v3.0.0)'
        required: true
        type: string
      docs_ref:
        description: 'Docs commit or branch containing the approved release documentation'
        required: true
        default: main
        type: string

concurrency:
  group: docs-release
  cancel-in-progress: false
  queue: max

jobs:
  create_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Resolve selected docs revision
        id: docs
        env:
          DOCS_REF: ${{ inputs.docs_ref || github.event.client_payload.docs_ref || github.sha }}
        run: echo "sha=$(git rev-parse --verify --end-of-options "${DOCS_REF}^{commit}")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install documentation dependencies
        run: yarn install --frozen-lockfile

      - name: Generate references from the release revision
        uses: ./.github/actions/generate-study-docs
        with:
          ref: ${{ inputs.release_tag || github.event.client_payload.release_tag || 'main' }}
          fetch-depth: '0'

      - name: Resolve exact stable release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag }}
        run: |
          # Existing study dispatches have no payload. Require main itself to be
          # tagged instead of guessing the release from tag dates.
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(git -C .study-docs describe --exact-match --tags HEAD)
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Supply an exact stable release_tag and docs_ref using workflow dispatch.' >&2
            exit 1
          fi
          # Generation must already have used the tagged commit.
          test "$(git -C .study-docs rev-parse HEAD)" = "$(git -C .study-docs rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Snapshot selected docs and release references
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: |
          node scripts/createDocsVersion.mjs "$RELEASE_TAG" "$DOCS_SHA" .study-docs

      - name: Generate Next references for validation
        uses: ./.github/actions/generate-study-docs
        with:
          ref: dev

      - name: Update Next references
        run: |
          node scripts/syncStudyDocs.mjs .study-docs docs
          rm -rf .study-docs

      - name: Validate release snapshot
        run: |
          yarn test
          yarn typecheck
          yarn build

      - name: Commit and push release snapshot
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add versions.json docs-releases.json "versioned_docs/version-$RELEASE_TAG" "versioned_sidebars/version-$RELEASE_TAG-sidebars.json"
          if ! git diff --cached --quiet; then
            git commit -m "Publish documentation for $RELEASE_TAG"
            git push origin HEAD:main
          fi
