name: Promote documentation release

on:
  repository_dispatch:
    types: [study_repo_publish]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact stable study tag to publish (for example v3.0.0)'
        required: true
        type: string
      docs_ref:
        description: 'Docs commit or branch whose docs/next should become current'
        required: true
        default: main
        type: string

concurrency:
  group: docs-release
  cancel-in-progress: false
  queue: max

jobs:
  create_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Resolve release request
        id: request
        run: node scripts/resolveStudyRelease.mjs request >> "$GITHUB_OUTPUT"

      - name: Resolve selected docs revision
        id: docs
        env:
          DOCS_REF: ${{ steps.request.outputs.docs_ref }}
        run: |
          sha=$(node scripts/createDocsVersion.mjs resolve "$DOCS_REF")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install documentation dependencies
        run: yarn install --frozen-lockfile

      - name: Generate references from the release revision
        uses: ./.github/actions/generate-study-docs
        with:
          ref: ${{ steps.request.outputs.study_ref }}
          fetch-depth: '0'

      - name: Resolve exact stable release tag
        id: release
        env:
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          node scripts/resolveStudyRelease.mjs verify .study-docs "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Archive current and promote approved Next
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DOCS_SHA: ${{ steps.docs.outputs.sha }}
        run: |
          node scripts/createDocsVersion.mjs "$RELEASE_TAG" "$DOCS_SHA" .study-docs

      - name: Generate Next references for validation
        uses: ./.github/actions/generate-study-docs
        with:
          ref: dev

      - name: Update Next references
        run: |
          node scripts/syncStudyDocs.mjs .study-docs docs/next
          rm -rf .study-docs

      - name: Validate release snapshot
        run: |
          yarn test
          yarn typecheck
          yarn build

      - name: Commit and push release snapshot
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add --all -- docs/current sidebars.current.ts current-release.json versions.json versioned_docs versioned_sidebars
          if ! git diff --cached --quiet; then
            git commit -m "Publish documentation for $RELEASE_TAG"
            git push origin HEAD:main
          fi
