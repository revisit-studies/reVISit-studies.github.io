name: Deploy To GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# Shared with preview deletion so one publish cannot erase another.
concurrency:
  group: docs-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Next references from study dev
        uses: ./.github/actions/generate-study-docs
        with:
          ref: dev

      - name: Update Next references
        run: |
          node scripts/syncStudyDocs.mjs .study-docs docs
          rm -rf .study-docs

      - name: Validate documentation
        run: |
          yarn test
          yarn typecheck

      - name: Build stable and Next documentation
        run: yarn build
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && format('/PR{0}/', github.event.number) || '/' }}

      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: build
          include-hidden-files: true

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: build

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages

      - name: Skip superseded builds and closed previews
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            pull=$(gh pr view "$PR_NUMBER" --json state,headRefOid)
            current=$(jq -r 'select(.state == "OPEN") | .headRefOid' <<< "$pull")
          else
            current=$(git ls-remote origin refs/heads/main | cut -f1)
          fi
          echo "publish=$([[ "$current" == "$EXPECTED_HEAD" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish documentation
        if: steps.freshness.outputs.publish == 'true'
        env:
          PREVIEW_DIR: ${{ github.event_name == 'pull_request' && format('PR{0}', github.event.number) || '' }}
        run: bash scripts/publishPages.sh build .pages "$PREVIEW_DIR"

      - name: Update preview comment
        if: github.event_name == 'pull_request' && steps.freshness.outputs.publish == 'true'
        uses: hasura/comment-progress@v2.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: deploy-preview
          message: |
            Preview of ${{ github.sha }}:

            [Stable docs](https://revisit.dev/PR${{ github.event.number }}/docs/introduction/) · [Next docs](https://revisit.dev/PR${{ github.event.number }}/docs/next/introduction/)

            Changes may take a few minutes to propagate.
